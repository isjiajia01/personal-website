<!doctype html><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1">
<style>html,body{margin:0;height:100%;background:#fff}canvas{display:block;width:100%;height:100%;touch-action:none}</style>
<canvas id=cv></canvas>
<script type=module>
import { Canopy, MODE } from "./canopy.js";
const engine = new Canopy(document.getElementById("cv"), { ...MODE, density: 64, sat: 2 });
engine.load(await fetch("scene.json").then(r => r.json()));
engine.resize(); addEventListener("resize", () => engine.resize()); engine.start();
</script>
